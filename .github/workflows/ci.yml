name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: The analysis path must import with nothing installed
        run: |
          python -c "import sys; sys.path.insert(0, '.'); import swpl; print(swpl.__version__)"
          python -c "import sys; assert 'numpy' not in sys.modules"
      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -q
      - name: CLI smoke
        run: |
          python -m swpl.cli version
          python -m swpl.cli recommend --alpha 1.5 --ordered
